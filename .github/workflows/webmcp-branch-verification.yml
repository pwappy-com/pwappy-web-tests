name: Verify WebMCP staging branch

# Ordinary branch pushes do not run jobs. Only an explicitly marked tip commit
# starts this workflow; main and the disabled main workflow are not touched here.
on:
  push:
    branches: [feat/webmcp-authoring]

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pwappy-staging-shared-test-accounts
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ contains(github.event.head_commit.message, '[verify-webmcp]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Check offline contracts and credential-free test discovery
        run: |
          node --test offline-tests/*.test.mjs
          npm run test:discovery
          npm run test:webmcp:checks
      - name: Verify exact staged source before preparing authenticated jobs
        run: node scripts/branch-verification-guard.mjs preflight
        env:
          PWAPPY_TEST_BASE_URL: ${{ secrets.PWAPPY_TEST_BASE_URL }}
      - name: Prepare the complete normal and Premium browser matrix
        id: matrix
        run: |
          node --input-type=module - <<'JS'
          import { appendFileSync } from 'node:fs';
          import { MATRIX } from './scripts/branch-verification-guard.mjs';
          const matrix = ['normal', 'premium'].flatMap(suite => MATRIX.map(entry => ({
            ...entry, suite, runner: suite === 'premium' ? entry.os : entry.runner,
          })));
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(matrix)}\n`);
          JS

  verify:
    name: ${{ matrix.suite }} (${{ matrix.os }}, ${{ matrix.browser }})
    needs: preflight
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Serialize all live suites, including Premium PP/publication operations.
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: pwappy-staging-account-${{ matrix.os }}-${{ matrix.browser }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      # This step contains no login passcode and makes only the fixed marker GET.
      # Premium exits here unless the explicit source-bound authorization is set.
      - name: Recheck source, staging endpoints and Premium authorization before authentication
        run: node scripts/branch-verification-guard.mjs "$TEST_SUITE"
        env:
          TEST_SUITE: ${{ matrix.suite }}
          PWAPPY_TEST_BASE_URL: ${{ secrets.PWAPPY_TEST_BASE_URL }}
          PWAPPY_TEST_LOGIN_ENDPOINT: ${{ secrets.PWAPPY_TEST_LOGIN_ENDPOINT }}
          PWAPPY_TEST_POINTS_READ_ENDPOINT: ${{ vars.PWAPPY_TEST_POINTS_READ_ENDPOINT }}
          PWAPPY_WEBMCP_LIVE_PREMIUM_AUTHORIZED_SHA: ${{ vars.PWAPPY_WEBMCP_LIVE_PREMIUM_AUTHORIZED_SHA }}
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install the selected Playwright browser
        run: npx --no-install playwright install --with-deps "$BROWSER_BINARY"
        env:
          BROWSER_BINARY: ${{ matrix.binary }}
      - name: Check point preparation and stable account identity offline
        run: node --test tests/tools/test-point-preparation.test.mjs tests/tools/test-account-index.test.mjs
      - name: Run complete suite with raw evidence disabled
        id: run_tests
        run: node scripts/run-branch-verification.mjs "$TEST_SUITE" "$TEST_BROWSER" "$TEST_OS" tests
        env:
          TEST_SUITE: ${{ matrix.suite }}
          TEST_BROWSER: ${{ matrix.browser }}
          TEST_OS: ${{ matrix.os }}
          PWAPPY_TEST_BASE_URL: ${{ secrets.PWAPPY_TEST_BASE_URL }}
          PWAPPY_TEST_LOGIN_ENDPOINT: ${{ secrets.PWAPPY_TEST_LOGIN_ENDPOINT }}
          PWAPPY_TEST_LOGIN_PASSCODE: ${{ secrets.PWAPPY_TEST_LOGIN_PASSCODE }}
          PWAPPY_TEST_POINTS_READ_ENDPOINT: ${{ vars.PWAPPY_TEST_POINTS_READ_ENDPOINT }}
          PWAPPY_WEBMCP_LIVE_PREMIUM_AUTHORIZED_SHA: ${{ vars.PWAPPY_WEBMCP_LIVE_PREMIUM_AUTHORIZED_SHA }}
      - name: Clean only the stable account used by this suite
        if: ${{ always() && steps.run_tests.outputs.started == 'true' }}
        timeout-minutes: 10
        run: node scripts/run-branch-verification.mjs "$TEST_SUITE" "$TEST_BROWSER" "$TEST_OS" cleanup
        env:
          TEST_SUITE: ${{ matrix.suite }}
          TEST_BROWSER: ${{ matrix.browser }}
          TEST_OS: ${{ matrix.os }}
          PWAPPY_TEST_BASE_URL: ${{ secrets.PWAPPY_TEST_BASE_URL }}
          PWAPPY_TEST_LOGIN_ENDPOINT: ${{ secrets.PWAPPY_TEST_LOGIN_ENDPOINT }}
          PWAPPY_TEST_LOGIN_PASSCODE: ${{ secrets.PWAPPY_TEST_LOGIN_PASSCODE }}
          PWAPPY_TEST_POINTS_READ_ENDPOINT: ${{ vars.PWAPPY_TEST_POINTS_READ_ENDPOINT }}
          PWAPPY_WEBMCP_LIVE_PREMIUM_AUTHORIZED_SHA: ${{ vars.PWAPPY_WEBMCP_LIVE_PREMIUM_AUTHORIZED_SHA }}
      - name: Prepare metadata-only public artifact
        id: safe_artifact
        if: always()
        run: node scripts/artifact-safe-summary.mjs
        env:
          SAFE_TEST_SUITE: ${{ matrix.suite }}
          SAFE_TEST_OS: ${{ matrix.os }}
          SAFE_TEST_BROWSER: ${{ matrix.browser }}
          SAFE_TEST_EXIT_CODE: ${{ steps.run_tests.outputs.EXIT_CODE }}
      - name: Upload only verified workflow metadata
        if: ${{ always() && steps.safe_artifact.outcome == 'success' && steps.safe_artifact.outputs.verified == 'true' && steps.safe_artifact.outputs.summary_path != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: branch-summary-${{ matrix.suite }}-${{ matrix.os }}-${{ matrix.browser }}-${{ github.run_id }}
          path: ${{ steps.safe_artifact.outputs.summary_path }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false

  verification-result:
    needs: [preflight, verify]
    if: ${{ always() && needs.preflight.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require complete successful verification, not skipped or unauthorized suites
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          VERIFICATION_RESULT: ${{ needs.verify.result }}
        run: |
          if [ "$PREFLIGHT_RESULT" != success ] || [ "$VERIFICATION_RESULT" != success ]; then
            echo '::error::Branch verification is incomplete or failed. Do not merge on this result.'
            exit 1
          fi
          echo 'Configured branch suites passed, including cleanup. Isolated WebMCP and physical-device evidence remain separate requirements.'
